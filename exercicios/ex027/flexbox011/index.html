<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            background-color: salmon;
            flex-flow: row nowrap;
            display: flex;
        }
        div.intem{
            background-color: cadetblue;
            text-align: center;
            border: 1px solid black;
            flex-basis: 200px;
        }
        div#bloco1{
            flex-grow: 0;
            flex-shrink: 1;
        }
        div#bloco2{
           flex-grow: 2; 
           flex-shrink: 0;
        }
        div#bloco3{
            flex-grow: 1;
            flex-shrink: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="intem" id="bloco1">A</div>
        <div class="intem" id="bloco2">B</div>
        <div class="intem" id="bloco3">C</div>
    </div>
</body>
</html>

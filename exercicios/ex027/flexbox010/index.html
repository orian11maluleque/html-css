<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            background-color: salmon;
            flex-flow: row wrap;
            display: flex;
        }
        div.intem{
            background-color: cadetblue;
            text-align: center;
            border: 1px solid black;
            flex-basis: 200px;
            flex-shrink: 1;
            flex-grow: 0;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="intem">A</div>
        <div class="intem">B</div>
        <div class="intem">C</div>
    </div>
</body>
</html>

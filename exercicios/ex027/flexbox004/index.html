<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            background-color: salmon;
            height: 300px;
            display: flex;
            flex-flow: row wrap;
            justify-content: space-around;
            align-items: center;
        }
        div.intem{
            background-color: cadetblue;
            text-align: center;
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="intem">Exemplo A</div>
        <div class="intem">Exemplo B</div>
        <div class="intem">Exemplo C</div>
        <div class="intem">Exemplo D</div>
        <div class="intem">Exemplo E</div>
        <div class="intem">Exemplo F</div>
        <div class="intem">Exemplo G</div>
    </div>
</body>
</html>

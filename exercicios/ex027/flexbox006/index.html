<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            background-color: salmon;
            
            height: 400px;
            display: flex;
            flex-flow: row wrap;
            align-content: space-evenly;
            
        }
        div.intem{
            background-color: cadetblue;
            text-align: center;
            border: 2px solid black;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="intem">A</div>
        <div class="intem">B</div>
        <div class="intem">C</div>
        <div class="intem">D</div>
        <div class="intem">E</div>
        <div class="intem">F</div>
        <div class="intem">G</div>
        <div class="intem">H</div>
        <div class="intem">I</div>
        <div class="intem">J</div>
        <div class="intem">K</div>
        <div class="intem">L</div>
        <div class="intem">M</div>
    </div>
</body>
</html>

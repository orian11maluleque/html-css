<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            background-color: salmon;

            display: flex;
        }
        div.intem{
            background-color: cadetblue;
            text-align: center;
            flex: auto;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="intem">A</div>
        <div class="intem">B</div>
        <div class="intem">C</div>
        <div class="intem">D</div>
        <div class="intem">E</div>
        <div class="intem">F</div>
        <div class="intem">G</div>
    </div>
</body>
</html>

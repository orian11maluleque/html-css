<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            background-color: salmon;
            flex-flow: row nowrap;
            display: flex;
        }
        div.intem{
            background-color: cadetblue;
            text-align: center;
            border: 1px solid black;
         }
        div#bloco1{
            flex: 0 1 200px;
        }
        div#bloco2{
           flex: 2 0 200px;
        }
        div#bloco3{
            flex: 1 2 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="intem" id="bloco1">A</div>
        <div class="intem" id="bloco2">B</div>
        <div class="intem" id="bloco3">C</div>
    </div>
</body>
</html>
